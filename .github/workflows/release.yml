name: Release

on:
  push:
    branches: [main]

concurrency: release-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # npm Trusted Publishing: the job authenticates to the registry via an OIDC token
  # exchange — no long-lived NPM_TOKEN secret — and npm attaches provenance automatically.
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 for its npm ≥ 11.5, the floor for trusted publishing; the gate below
          # keeps parity with CI regardless of the version skew.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The publish gate: a release must never ship from a state the suite would refuse.
      # CI runs the same gate on its own workflow, but this job publishes — it verifies
      # for itself rather than trusting a sibling workflow's timing.
      - run: pnpm lint
      - run: pnpm test
      # While changesets accumulate this maintains the "Version Packages" PR;
      # when that PR merges, it publishes the bumped packages instead.
      - uses: changesets/action@v1
        with:
          version: pnpm release:version
          publish: pnpm release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # `changeset publish` creates the release tags in this checkout, but the action only
      # pushes them (and creates GitHub releases) when it can parse the publish output — which
      # pnpm's spinner UI defeats. These fallbacks are deterministic instead of parsed: push
      # whatever release tags point at HEAD, then create a GitHub release for any pushed tag
      # that lacks one, with the package CHANGELOG section as its body. Both are no-ops on
      # pushes that publish nothing.
      - name: Push release tags
        run: git push origin --tags
      - name: Ensure GitHub releases exist for new tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(git tag --points-at HEAD); do
            gh release view "$tag" --json tagName >/dev/null 2>&1 && continue
            name="${tag%@*}"; version="${tag##*@}"
            dir=$(pnpm --filter "$name" exec pwd 2>/dev/null | tail -1)
            notes="Patch release."
            if [ -n "$dir" ] && [ -f "$dir/CHANGELOG.md" ]; then
              notes=$(awk -v v="## $version" 'index($0,v)==1{f=1;next} /^## /{f=0} f' "$dir/CHANGELOG.md")
            fi
            gh release create "$tag" --title "$tag" --notes "$notes"
          done
