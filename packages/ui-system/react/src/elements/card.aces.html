<html lang="en">

<body>

  <!--
  @tag x-card
  @summary A surface that groups related content
  @attribute {boolean} [data-elevated] - When present, raises the card with a shadow
  -->
  <x-card>
    <!--
    @tag x-card-header
    @summary The card's header region
    -->
    <x-card-header></x-card-header>
    <!--
    @tag x-card-body
    @summary The card's main content
    @permits {content} /<flow>/
    -->
    <x-card-body></x-card-body>
  </x-card>

</body>

</html>
